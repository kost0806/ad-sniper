name: Build & Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEW_VERSION=$(npm version ${{ github.event.inputs.bump }} --no-git-tag-version | sed 's/^v//')
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

          # Sync version into manifest.json
          jq --arg v "$NEW_VERSION" '.version = $v' manifest.json > manifest.tmp.json
          mv manifest.tmp.json manifest.json

          git add package.json package-lock.json manifest.json
          git commit -m "chore: bump version to $NEW_VERSION"
          git push origin main

      - name: Build extension
        run: npm run build

      - name: Package extension
        run: |
          zip -r ad-sniper-${{ steps.version.outputs.new_version }}.zip \
            dist/ \
            manifest.json \
            icons/ \
            rules/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: Ad Sniper v${{ steps.version.outputs.new_version }}
          files: ad-sniper-${{ steps.version.outputs.new_version }}.zip
          generate_release_notes: true
