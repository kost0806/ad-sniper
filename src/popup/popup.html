<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ad Sniper</title>
  <link rel="stylesheet" href="./popup.css" />
</head>
<body>
  <div class="header">
    <img src="../../../icons/icon48.png" alt="Ad Sniper" class="logo" />
    <div class="title-block">
      <h1>Ad Sniper</h1>
      <p class="subtitle">보기 싫은 광고만 차단</p>
    </div>
  </div>

  <div class="site-row">
    <span id="site-name" class="site-name">이 사이트</span>
    <label class="toggle">
      <input type="checkbox" id="site-toggle" checked />
      <span class="slider"></span>
    </label>
  </div>

  <div class="stats">
    <span id="block-count">0</span>개 패턴 차단 중
  </div>

  <div class="actions">
    <button id="open-options">차단 목록 관리</button>
  </div>

  <p class="hint">광고를 <strong>우클릭</strong>하여 "이 광고 차단"을 선택하세요.</p>

  <script type="module" src="./popup.js"></script>
</body>
</html>
