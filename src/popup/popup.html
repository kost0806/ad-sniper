<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ad Sniper</title>
  <link rel="stylesheet" href="./popup.css" />
</head>
<body>
  <div class="header">
    <img src="../../../icons/icon48.png" alt="Ad Sniper" class="logo" />
    <div class="title-block">
      <h1>Ad Sniper</h1>
      <p class="subtitle" data-i18n="popup_subtitle"></p>
    </div>
  </div>

  <div class="site-row">
    <span id="site-name" class="site-name" data-i18n="popup_this_site"></span>
    <label class="toggle">
      <input type="checkbox" id="site-toggle" checked />
      <span class="slider"></span>
    </label>
  </div>

  <div class="stats">
    <span id="block-count">0</span><span id="blocked-suffix" data-i18n="popup_blocked_suffix"></span>
  </div>

  <div class="actions">
    <button id="open-options" data-i18n="popup_manage"></button>
  </div>

  <p class="hint" id="popup-hint"></p>

  <script type="module" src="./popup.js"></script>
</body>
</html>
